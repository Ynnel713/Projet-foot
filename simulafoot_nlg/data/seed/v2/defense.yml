      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Heading
        operator: '>='
        value: '82'
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
    - text: Esseulé face à deux attaquants de {adversaire}, {joueur} temporise intelligemment
        avant d'intervenir au bon moment !
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Vision
        operator: '>='
        value: '75'
        mandatory: true
      - attribute: Aggression
        operator: <=
        value: '55'
        mandatory: true
      slots:
      - slot_name: adversaire
        expression: context.opponent_team
      - slot_name: joueur
        expression: player.full_name
    - text: '{joueur} hausse le ton physiquement et prend le dessus dans chaque duel
        face aux assauts de {adversaire} !'
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Strength
        operator: '>='
        value: '85'
        mandatory: true
      - attribute: Aggression
        operator: '>='
        value: '60'
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: D'une lecture précoce du jeu, {joueur} coupe la ligne de passe avant que
        l'idée n'ait germé dans la tête de {adversaire} !
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Vision
        operator: '>='
        value: '85'
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} se jette corps et âme devant la tentative et stoppe le cuir
        sur la ligne, au prix d''une égratignure !'
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Tackling
        operator: '>='
        value: '78'
        mandatory: true
      - attribute: Aggression
        operator: '>='
        value: '60'
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
    - text: '{joueur} met un tacle propre, bien dosé, et le jeu repart de l''autre
        côté.'
      weight: 1.0
      cooldown_matches: 2
      conditions: []
      slots:
      - slot_name: joueur
        expression: player.full_name
    - text: '{joueur} se place juste, intercepte la passe destinée à {adversaire}
