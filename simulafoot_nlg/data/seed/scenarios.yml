- code: GESTE_SIGNATURE
  label: Geste signature du joueur
  variants:
  - code: DEFAUT
    label: Variante par défaut
    is_default: true
    phrases:
    - text: '{joueur} prend un malin plaisir à recommencer : après avoir déjà éliminé
        son vis-à-vis une première fois, il repart à l''assaut et l''élimine une seconde
        fois d''affilée sur la même action, provoquant l''hilarité des tribunes de
        {club}. L''arrière de {adversaire} ne sait plus où donner de la tête face
        à ce festival répété sur son côté.'
      weight: 1.0
      conditions:
      - attribute: preferred_moves
        operator: contient
        value: Likes To Beat Opponent Repeatedly
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: club
        expression: context.player_team
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} enchaîne les petits ponts et les crochets déroutants sans jamais
        se départir de son sang-froid, transformant chaque duel individuel en démonstration
        technique. La défense de {adversaire} est menée en bateau, incapable de suivre
        le rythme de ses appuis.'
      weight: 1.0
      conditions:
      - attribute: preferred_moves
        operator: contient
        value: Tries Tricks
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} n''est jamais d''accord avec la moindre décision de l''arbitre
        et le lui fait savoir bruyamment, les bras levés au ciel à chaque coup de
        sifflet contraire. L''homme en noir commence sérieusement à perdre patience
        face à ce chapelet de contestations incessantes.'
      weight: 1.0
      conditions:
      - attribute: preferred_moves
        operator: contient
        value: Argues With Officials
        mandatory: true
