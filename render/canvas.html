<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rendu canvas -- vertical slice / lecteur de clips</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0b; font-family: sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 12px; }
  #canvasWrap { position: relative; }
  canvas { background: #1e824c; display: block; max-width: 100%; height: auto; }
  #controls { padding: 8px 0; }
  button { font-size: 14px; padding: 6px 16px; margin: 0 4px; cursor: pointer; }
  #label { color: #eee; font-size: 13px; padding-bottom: 4px; }

  /* --- Mode player : bloc score et bandeau de lecture (Phase 5, sous-etape 3) ---- */
  #stage { position: relative; }

  /* Bloc score compact, haut-centre : abreviations des clubs, score, minute. Taille
     fixe (hauteur 26 px, largeur max 200 px), jamais sur les surfaces de reparation
    (centre du terrain). */
  #scoreboard {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; justify-content: center; gap: 8px;
    height: 26px; max-width: 200px; padding: 0 10px; box-sizing: border-box;
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 3px;
    color: #fff; font: 600 13px/1 sans-serif; white-space: nowrap; overflow: hidden;
    pointer-events: none;
  }
  #scoreboard .sb-score { font-variant-numeric: tabular-nums; }
  /* Effet au but (Phase 5, sous-etape 4) : eclaircissement doux du bloc pendant 1 s, une fois par but. */
  #scoreboard { transition: background-color 0.3s ease, border-color 0.3s ease; }
  #scoreboard.goal-flash { background: rgba(120, 120, 120, 0.85); border-color: #ffffff; }
  #scoreboard .sb-minute { opacity: 0.75; font-weight: 400; }

  /* Bandeau de lecture, sous le terrain, meme largeur que lui : hauteur fixe 52 px,
     fond sombre semi-transparent. De gauche a droite : lecture/pause, precedent,
     suivant (et rejouer), barre de progression, compteur de clips. */
  #playbar {
    display: none; align-items: center; gap: 12px; height: 52px; padding: 0 12px; box-sizing: border-box;
    background: rgba(0, 0, 0, 0.7); color: #fff;
  }
  #playerControls { display: none; align-items: center; gap: 8px; }
  .player-btn {
    width: 32px; height: 32px; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center;
    background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 4px; cursor: pointer;
  }
  .player-btn svg { width: 18px; height: 18px; fill: currentColor; display: block; }
  .player-btn:hover { background: rgba(255, 255, 255, 0.14); }
  .player-btn:active { background: rgba(255, 255, 255, 0.24); }
  .player-btn:focus-visible { outline: 2px solid #ffd700; outline-offset: 1px; }

  /* Barre de progression : un marqueur cliquable par clip, positionne proportionnellement
     a la minute. But = cercle blanc plein ; occasion = losange gris. Clip courant = anneau dore. */
  #progressBar { display: none; position: relative; flex: 1; height: 100%; min-width: 0; margin: 0 8px; }
  #progressTrack {
    position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    background: rgba(255, 255, 255, 0.28); transform: translateY(-50%);
  }
  .progress-marker { position: absolute; top: 50%; cursor: pointer; box-sizing: border-box; }
  .progress-marker.goal { width: 12px; height: 12px; border-radius: 50%; background: #ffffff; transform: translate(-50%, -50%); z-index: 2; }  /* un but n'est jamais masque par une occasion voisine */
  .progress-marker.chance { width: 9px; height: 9px; background: #9aa0a6; transform: translate(-50%, -50%) rotate(45deg); z-index: 1; }
  .progress-marker:hover { filter: brightness(1.25); }
  .progress-marker.current { box-shadow: 0 0 0 2px #ffd700; z-index: 3; }
  #clipCounter { min-width: 72px; text-align: right; font: 12px/1 sans-serif; color: #fff; white-space: nowrap; }

  /* Mode embarque uniquement (classe `embed` posee par le JS, jamais en
     standalone) : le canevas se reduit pour que le bandeau de lecture reste
     visible dans la hauteur de l'iframe. */
  body.embed canvas { max-height: calc(100vh - 110px); }

  /* Carton intermediaire (brief 4.5) : overlay semi-transparent, 2s par
     defaut (voir CARTON_DURATION_S plus bas), pas de degrade/ombre lourd. */
  #carton {
    display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.72);
    color: #fff; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; box-sizing: border-box;
  }
  #cartonMinute { font-size: 14px; color: #ccc; margin-bottom: 6px; }
  #cartonEvent { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  #cartonScore { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
  #cartonIntervalEvents { font-size: 13px; color: #ddd; line-height: 1.6; }
</style>
</head>
<body>
<div id="wrap">
  <div id="label"></div>
  <div id="canvasWrap">
    <div id="stage">
      <canvas id="pitch" width="1200" height="780"></canvas>
      <div id="scoreboard"><span id="sbHome"></span><span id="sbScore" class="sb-score"></span><span id="sbAway"></span><span id="sbMinute" class="sb-minute"></span></div>
      <div id="carton">
        <div id="cartonMinute"></div>
        <div id="cartonEvent"></div>
        <div id="cartonScore"></div>
        <div id="cartonIntervalEvents"></div>
      </div>
    </div>
    <div id="playbar">
      <div id="playerControls">
        <button class="player-btn" id="playPause" title="Lecture / pause" aria-label="Lecture / pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
        <button class="player-btn" id="prevClip" title="Clip precedent" aria-label="Clip precedent"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="2.5" height="14"/><path d="M19 5v14L9 12z"/></svg></button>
        <button class="player-btn" id="nextClip" title="Clip suivant" aria-label="Clip suivant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l10-7z"/><rect x="16.5" y="5" width="2.5" height="14"/></svg></button>
        <button class="player-btn" id="replayClip" title="Rejouer le clip" aria-label="Rejouer le clip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      </div>
      <div id="progressBar">
        <div id="progressTrack"></div>
      </div>
      <div id="clipCounter"></div>
    </div>
  </div>
  <div id="controls">
    <button id="toggle">Pause</button>
    <button id="replay">Recommencer</button>
  </div>
</div>
<script>
// Brief "canvas vertical slice" (23/09/2026) puis "canvas player" (Tache 4,
// meme date) -- fichier autonome, pas de dependance (ni React, ni
// librairie JS externe), mode "gabarit isole" et mode "player" cohabitent.
//
// PLACEHOLDER D'INJECTION -- l'appelant (scripts/render_preview.py,
// apps/streamlit_preview.py) remplace le texte EXACT
// "/*__SEQUENCE_JSON__*/null" ci-dessous par le JSON produit soit par
// animation.serialize.frame_sequence_to_json (UN SEUL objet -- mode
// "gabarit isole"), soit par engine.narrative_player.clips_to_json (un
// TABLEAU de plusieurs objets de meme forme + metadonnees narratives -- mode
// "player"), voir docs/canvas_json_schema.md. Un simple replace() textuel
// suffit -- aucun templating.
const SEQUENCE_DATA = /*__SEQUENCE_JSON__*/null;

// Cotes du terrain en METRES -- Phase 5, sous-etape 1. Bloc DERIVE de
// src/ligue1sim/pitch_geometry.py (source unique, fonction pitch_dimensions_json) :
// ne jamais le modifier a la main, tests/test_canvas_html.py verifie l'egalite.
// Regenerer : python -m ligue1sim.pitch_geometry
const PITCH = /*PITCH_GEOMETRY_BEGIN*/{"center_circle_radius_m":9.15,"corner_arc_radius_m":1.0,"goal_area_depth_m":5.5,"goal_area_width_m":18.32,"goal_net_depth_m":2.0,"goal_width_m":7.32,"penalty_arc_radius_m":9.15,"penalty_area_depth_m":16.5,"penalty_area_width_m":40.32,"penalty_spot_distance_m":11.0,"pitch_length_m":105.0,"pitch_width_m":68.0}/*PITCH_GEOMETRY_END*/;

// MODE EMBARQUE (iframe de la PWA, docs/canvas_integration_state.md §2.11,
// protocole version 1) -- active UNIQUEMENT par `?embed=1`. Sans ce
// parametre, le fichier se comporte exactement comme avant (mode standalone :
// donnees injectees par remplacement du placeholder ci-dessus) -- le corps du
// lecteur, `startPlayer`, est l'ancienne IIFE a l'identique, seuls trois
// points d'accroche `if (bridge)` (inertes en standalone, `bridge === null`)
// y ont ete ajoutes.
const EMBED_PARAMS = new URLSearchParams(window.location.search);
const EMBED = EMBED_PARAMS.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');

function startPlayer(SEQUENCE_DATA, bridge) {
  if (!SEQUENCE_DATA) {
    document.getElementById('label').textContent =
      'Aucune sequence injectee -- ce fichier est un gabarit, voir scripts/render_preview.py';
    return;
  }

  // Normalisation : un objet seul OU un tableau d'un seul element -> mode
  // "gabarit isole" (comportement inchange). Un tableau de 2+ -> mode
  // "player" (Tache 4.1).
  const clips = Array.isArray(SEQUENCE_DATA) ? SEQUENCE_DATA : [SEQUENCE_DATA];
  // En mode embarque (bridge != null) le mode "player" est force meme pour un
  // seul clip : un match n'a pas forcement 2+ temps forts.
  const isPlayerMode = clips.length > 1 || bridge !== null;

  const canvas = document.getElementById('pitch');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const MARGIN = 20;

  const DEBUG = new URLSearchParams(window.location.search).get('debug') === '1';
  let debugFrameIdx = 0;

  // Duree du carton intermediaire, en secondes -- constante ajustable
  // (brief 4.5), documentee ici plutot qu'eparpillee dans le code.
  const CARTON_DURATION_S = 2.0;

  // Projection en metres (Phase 5, sous-etape 1) : le terrain 105 x 68 m est
  // inscrit dans le canvas avec au moins MARGIN px de chaque cote, a UNE SEULE
  // echelle (px par metre, meme valeur sur x et y : les cercles restent
  // ronds), et centre. Le referentiel normalise du moteur ([0, 1], x=0/x=1 =
  // lignes de but, y=0/y=1 = touches) correspond EXACTEMENT a ce rectangle.
  // Meme formule que pitch_geometry.pitch_rect_px (Python).
  const PITCH_L = PITCH.pitch_length_m, PITCH_W = PITCH.pitch_width_m;
  const SCALE = Math.min((W - 2 * MARGIN) / PITCH_L, (H - 2 * MARGIN) / PITCH_W);
  const OX = (W - PITCH_L * SCALE) / 2, OY = (H - PITCH_W * SCALE) / 2;

  // Pelouse a bandes (Phase 5, sous-etape 3) : 9 bandes de 68 / 9 = 7,6 m (7 bandes feraient 9,7 m).
  // Deux tons proches : #1e824c (luminance relative 0.168) et #1e8650 (0.179), ecart 6.8 %.
  const STRIPE_COUNT = 9;
  const GRASS_DARK = '#1e824c';
  const GRASS_LIGHT = '#1e8650';

  // Filets de but (Phase 5, sous-etape 4). Profondeur et largeur : cotes de PITCH (pitch_geometry.py).
  const NET_COLS = 12;                   // mailles dans la largeur du but (7,32 m / 12 = 0,61 m)
  const NET_ROWS = 4;                    // mailles dans la profondeur (2 m / 4 = 0,5 m)
  const NET_ANIM_S = 0.5;                // duree de l'oscillation du filet au but (0,4 a 0,6 s)
  const NET_AMPLITUDE_M = 0.55;          // deplacement maximal du fond du filet
  const NET_FREQ_HZ = 6;                 // 3 oscillations en 0,5 s
  const NET_DECAY_PER_S = 6;             // enveloppe exp(-6 t) : ~5 % de l'amplitude a 0,5 s
  const NET_SPREAD_M = 1.8;              // etalement lateral de la deformation autour de l'impact
  const GOAL_FLASH_S = 1.0;              // duree de l'eclaircissement du bloc score
  const GOAL_HOLD_S = 1.4;               // maintien de la derniere image apres un but, avant la carte de titre

  // Metres (origine coin bas-gauche du terrain, y vers le haut) -> pixels canvas.
  function mToPx(mx, my) {
    return [OX + mx * SCALE, OY + (PITCH_W - my) * SCALE];
  }

  // Referentiel normalise du moteur -> pixels canvas.
  function toPx(x, y) {
    return mToPx(x * PITCH_L, y * PITCH_W);
  }

  function lerp(a, b, f) {
    return a + (b - a) * f;
  }

  function dot(px, py) {
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPitch() {
    ctx.fillStyle = GRASS_DARK;
    ctx.fillRect(0, 0, W, H);
    // Bandes de tonte : STRIPE_COUNT bandes horizontales (paralleles aux touches) sur le terrain
    // seulement ; les bandes impaires sont plus claires, les lignes sont tracees par-dessus.
    const bandH = PITCH_W * SCALE / STRIPE_COUNT;
    ctx.fillStyle = GRASS_LIGHT;
    for (let i = 1; i < STRIPE_COUNT; i += 2) ctx.fillRect(OX, OY + i * bandH, PITCH_L * SCALE, bandH);
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 2;

    // Touches et lignes de but, ligne mediane, rond central.
    const [x0, y0] = mToPx(0, PITCH_W);
    ctx.strokeRect(x0, y0, PITCH_L * SCALE, PITCH_W * SCALE);
    ctx.beginPath();
    ctx.moveTo(...mToPx(PITCH_L / 2, 0));
    ctx.lineTo(...mToPx(PITCH_L / 2, PITCH_W));
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(...mToPx(PITCH_L / 2, PITCH_W / 2), PITCH.center_circle_radius_m * SCALE, 0, Math.PI * 2);
    ctx.stroke();
    dot(...mToPx(PITCH_L / 2, PITCH_W / 2));

    // Chaque extremite : dir = +1 a gauche (ligne de but en x = 0), -1 a droite.
    // Angle d'ouverture de l'arc de surface : acos((profondeur surface - distance du point de penalty) / rayon de l'arc).
    const arcHalfAngle = Math.acos(
      (PITCH.penalty_area_depth_m - PITCH.penalty_spot_distance_m) / PITCH.penalty_arc_radius_m
    );
    for (const dir of [1, -1]) {
      const goalLineX = dir === 1 ? 0 : PITCH_L;
      const midY = PITCH_W / 2;

      // Surface de reparation et surface de but (rectangles colles a la ligne de but).
      for (const [depth, width] of [
        [PITCH.penalty_area_depth_m, PITCH.penalty_area_width_m],
        [PITCH.goal_area_depth_m, PITCH.goal_area_width_m],
      ]) {
        const [rx, ry] = mToPx(dir === 1 ? goalLineX : goalLineX - depth, midY + width / 2);
        ctx.strokeRect(rx, ry, depth * SCALE, width * SCALE);
      }

      // Point de penalty et arc de cercle (portion hors de la surface seulement).
      const [spotPx, spotPy] = mToPx(goalLineX + dir * PITCH.penalty_spot_distance_m, midY);
      dot(spotPx, spotPy);
      ctx.beginPath();
      if (dir === 1) ctx.arc(spotPx, spotPy, PITCH.penalty_arc_radius_m * SCALE, -arcHalfAngle, arcHalfAngle);
      else ctx.arc(spotPx, spotPy, PITCH.penalty_arc_radius_m * SCALE, Math.PI - arcHalfAngle, Math.PI + arcHalfAngle);
      ctx.stroke();

      // But : trait de 4 px entre les poteaux, sur la ligne de but (filets : sous-etape ulterieure).
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(...mToPx(goalLineX, midY - PITCH.goal_width_m / 2));
      ctx.lineTo(...mToPx(goalLineX, midY + PITCH.goal_width_m / 2));
      ctx.stroke();
      ctx.lineWidth = 2;
    }

    // Arcs de coin : quart de cercle de rayon corner_arc_radius_m centre sur chaque poteau de corner.
    const cornerR = PITCH.corner_arc_radius_m * SCALE;
    const corners = [
      [mToPx(0, 0), -Math.PI / 2, 0],
      [mToPx(0, PITCH_W), 0, Math.PI / 2],
      [mToPx(PITCH_L, PITCH_W), Math.PI / 2, Math.PI],
      [mToPx(PITCH_L, 0), Math.PI, Math.PI * 1.5],
    ];
    for (const [[cx, cy], from, to] of corners) {
      ctx.beginPath();
      ctx.arc(cx, cy, cornerR, from, to);
      ctx.stroke();
    }
  }

  // Segment [frames[i], frames[i+1]] encadrant t, et fraction s dans ce
  // segment, POUR UN CLIP DONNE (parametre, plus une variable globale
  // implicite -- necessaire pour rejouer plusieurs clips avec la meme
  // fonction, voir mode player).
  function findSegment(clipData, t) {
    const frames = clipData.frames;
    const last = frames.length - 1;
    if (t <= frames[0].t) return [frames[0], frames[Math.min(1, last)], 0];
    if (t >= frames[last].t) return [frames[Math.max(0, last - 1)], frames[last], 1];
    for (let i = 0; i < last; i++) {
      if (frames[i].t <= t && t <= frames[i + 1].t) {
        const span = frames[i + 1].t - frames[i].t;
        const frac = span > 0 ? (t - frames[i].t) / span : 0;
        return [frames[i], frames[i + 1], frac];
      }
    }
    return [frames[last], frames[last], 0];
  }

  // --- Tailles en PIXELS ECRAN (Phase 5, sous-etape 2) ---------------------
  // Le canvas fait 1200 x 780 px mais est reduit par CSS : ses dimensions
  // internes ne disent rien de ce que l'utilisateur voit. Les tailles
  // ci-dessous sont donc exprimees en pixels ECRAN (px CSS) puis converties en
  // pixels canvas par le rapport canvas.width / largeur affichee. Ce rapport
  // est calcule au chargement et a chaque redimensionnement (ResizeObserver),
  // jamais a chaque image. Le device pixel ratio n'intervient pas : un px CSS
  // occupe dpr x dpr pixels physiques, la taille PERCUE reste la meme sur tout
  // ecran (seule la nettete change).
  const PLAYER_DIAMETER_SCREEN_PX = 14;
  const ACTIVE_DIAMETER_RATIO = 13 / 9;  // le joueur "actif" (role mis en scene) garde son surcroit d'emphase d'origine
  const NUMBER_FONT_RATIO = 0.58;        // taille du numero / diametre du rond
  const NAME_FONT_SCREEN_PX = 10;
  const BALL_DIAMETER_SCREEN_PX = 6;
  const HEADING_TIP_SCREEN_PX = 3.5;     // depassement de la pointe d'orientation au-dela du rond
  const BALL_CARRIED_MAX_M = 3;          // distance max ballon-porteur pour afficher le nom du porteur
  const HEADING_MIN_SPEED_MS = 0.3;      // en dessous, le joueur est a l'arret : on garde son dernier cap

  let pxPerScreenPx = 1;
  let sizes = null;

  function updateSizes() {
    const rect = canvas.getBoundingClientRect();
    pxPerScreenPx = rect.width > 0 ? canvas.width / rect.width : 1;
    sizes = {
      playerRadius: PLAYER_DIAMETER_SCREEN_PX / 2 * pxPerScreenPx,
      activeRadius: PLAYER_DIAMETER_SCREEN_PX * ACTIVE_DIAMETER_RATIO / 2 * pxPerScreenPx,
      ballRadius: BALL_DIAMETER_SCREEN_PX / 2 * pxPerScreenPx,
      nameFont: NAME_FONT_SCREEN_PX * pxPerScreenPx,
      headingTip: HEADING_TIP_SCREEN_PX * pxPerScreenPx,
    };
  }
  updateSizes();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(updateSizes).observe(canvas);
  window.addEventListener('resize', updateSizes);

  // Couleur du numero contrastee sur le remplissage du rond (blanc ou quasi noir).
  const numberColorCache = {};
  function numberColor(hex) {
    if (!(hex in numberColorCache)) {
      const n = parseInt(hex.slice(1), 16);
      const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      const lum = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
      numberColorCache[hex] = lum > 0.4 ? '#111111' : '#ffffff';
    }
    return numberColorCache[hex];
  }

  // Dernier cap connu de chaque joueur, par clip (orientation deduite du deplacement
  // entre deux images consecutives ; un joueur a l'arret conserve son dernier cap).
  const headingsByClip = new WeakMap();

  function drawHeading(px, py, radius, angle) {
    const tip = radius + sizes.headingTip;
    const baseR = radius * 0.92;
    const half = 0.55;  // demi-ouverture angulaire de la base (radians)
    ctx.beginPath();
    ctx.moveTo(px + Math.cos(angle) * tip, py + Math.sin(angle) * tip);
    ctx.lineTo(px + Math.cos(angle + half) * baseR, py + Math.sin(angle + half) * baseR);
    ctx.lineTo(px + Math.cos(angle - half) * baseR, py + Math.sin(angle - half) * baseR);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.fill();
    ctx.lineWidth = 0.6 * pxPerScreenPx;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.stroke();
  }

  // Nom du porteur sous son rond, sur fond semi-transparent. Affiche uniquement si le
  // clip porte `metadata.main_player` ; le nom vient de `metadata.player_names[id]`
  // (id du porteur = `frame.ball.owner`), repli sur `main_player` pour un joueur actif.
  function drawCarrierName(clipData, pa, px, py, radius) {
    const meta = clipData.metadata;
    if (!meta.main_player) return;
    let name = meta.player_names ? meta.player_names[pa.id] : null;
    if (!name && pa.active) name = meta.main_player;
    if (!name) return;
    if (name.length > 18) name = name.slice(0, 17) + '\u2026';
    ctx.font = sizes.nameFont + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const padding = 2 * pxPerScreenPx;
    const width = ctx.measureText(name).width + 2 * padding;
    const top = py + radius + 2 * pxPerScreenPx;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(px - width / 2, top, width, sizes.nameFont + 2 * padding);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(name, px, top + padding);
  }

  // --- Detection du but (donnees existantes, aucune simulation) --------------
  // Un clip de but (`metadata.issue === 'but'`) se termine quand le ballon franchit la ligne :
  // on cherche, dans les positions du ballon de la sequence, la premiere image ou il est
  // au-dela d'une ligne de but (x <= 0 ou x >= 1) ENTRE LES POTEAUX (|y - 0,5| <= demi-largeur
  // du but). Plusieurs entrees sont possibles ; deux evenements sont toujours espaces d'au moins
  // NET_ANIM_S, donc les animations ne se chevauchent jamais. Sans but : aucun evenement.
  // Repli : un clip de but sans franchissement mesurable declenche a sa derniere image.
  // Resultat memorise par clip.
  const goalEventsCache = new WeakMap();
  function goalEvents(clipData) {
    let events = goalEventsCache.get(clipData);
    if (events) return events;
    events = [];
    if (clipData.metadata && clipData.metadata.issue === 'but') {
      const halfGoal = PITCH.goal_width_m / 2 / PITCH_W;
      let inGoal = false;
      for (const f of clipData.frames) {
        const b = f.ball;
        const side = b.x >= 1 ? -1 : (b.x <= 0 ? 1 : 0);  // -1 : but de droite, +1 : but de gauche
        const inside = side !== 0 && Math.abs(b.y - 0.5) <= halfGoal;
        if (inside && !inGoal && (!events.length || f.t - events[events.length - 1].t >= NET_ANIM_S)) {
          events.push({ t: f.t, dir: side, yM: b.y * PITCH_W });
        }
        inGoal = inside;
      }
      if (!events.length) {
        const last = clipData.frames[clipData.frames.length - 1];
        events.push({ t: last.t, dir: last.ball.x >= 0.5 ? -1 : 1, yM: last.ball.y * PITCH_W });
      }
    }
    goalEventsCache.set(clipData, events);
    return events;
  }

  // Fin de lecture d'un clip : sa duree, prolongee de GOAL_HOLD_S apres un but pour laisser jouer le filet et
  // l'eclaircissement du score avant la carte de titre.
  function playEnd(clipData) {
    const events = goalEvents(clipData);
    const base = events.length ? Math.max(clipData.duration, events[events.length - 1].t) + GOAL_HOLD_S : clipData.duration;
    return Math.max(base, ballEventsEnd(clipData)); // Phase 6, B4-bis : un evenement de fin de clip reste visible
  }

  // --- Evenements du ballon (Phase 6, B4-bis) ---------------------------------------------------------------
  // Lecture de `metadata.events_ball` : champ OPTIONNEL du clip, produit par le moteur (engine/ball_events.py) --
  // parade, poteau, barre, corner, sortie de but. Le BUT reste detecte par goalEvents() ci-dessus, inchange. Sans le
  // champ (ancien payload, JSON injecte sans evenements) : rien n'est dessine. Le ballon lui-meme suit deja sa
  // trajectoire de rebond dans les images ; ces effets ne font que la souligner (anneau, fleche, flash, etiquette).
  const BALL_FX_LABELS = { parade: 'Parade', poteau: 'Poteau', barre: 'Barre', corner: 'Corner', sortie_but: 'Sortie de but' };
  const BALL_FX_LABELLED = new Set(['parade', 'corner', 'sortie_but']);  // poteau et barre : flash discret, sans texte
  const BALL_FX_S = NET_ANIM_S;          // duree de l'effet (0,5 s, comme l'oscillation du filet)
  const BALL_FX_LABEL_S = GOAL_FLASH_S;  // duree de l'etiquette (1,0 s)
  const BALL_FX_COLOR = '#ffd700';       // meme or que le contour du joueur actif
  const BALL_FX_LABEL_FONT_SCREEN_PX = 11;
  const ballEventsCache = new WeakMap();
  function ballEvents(clipData) {
    let events = ballEventsCache.get(clipData);
    if (!events) {
      const raw = clipData.metadata && Array.isArray(clipData.metadata.events_ball) ? clipData.metadata.events_ball : [];
      events = raw.filter((ev) => ev && Object.prototype.hasOwnProperty.call(BALL_FX_LABELS, ev.type) && typeof ev.t === 'number');
      ballEventsCache.set(clipData, events);
    }
    return events;
  }
  function ballEventsEnd(clipData) {
    let end = 0;
    for (const ev of ballEvents(clipData)) end = Math.max(end, ev.t + BALL_FX_S);
    return end;
  }

  function drawBallEvents(clipData, playhead) {
    const halfGoal = PITCH.goal_width_m / 2 / PITCH_W;
    for (const ev of ballEvents(clipData)) {
      const age = playhead - ev.t;
      if (age < 0 || age >= BALL_FX_LABEL_S) continue;
      const p = Math.min(1, age / BALL_FX_S);
      const [px, py] = toPx(ev.x, ev.y);
      const unit = pxPerScreenPx;
      if (age < BALL_FX_S) {
        ctx.save();
        ctx.globalAlpha = 1 - p;
        ctx.strokeStyle = BALL_FX_COLOR;
        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 2 * unit;
        if (ev.type === 'parade') {
          ctx.beginPath();
          ctx.arc(px, py, (7 + 16 * p) * unit, 0, Math.PI * 2);
          ctx.stroke();
          if (typeof ev.direction_deg === 'number') {
            // Cap de sortie du ballon : 0 deg = vers le but attaque (+x), 90 deg = vers +y (le haut de l'ecran).
            const a = -ev.direction_deg * Math.PI / 180;
            const len = (14 + 22 * p) * unit;
            const ex = px + len * Math.cos(a), ey = py + len * Math.sin(a);
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(ex, ey);
            for (const side of [-1, 1]) {
              ctx.moveTo(ex, ey);
              ctx.lineTo(ex + 6 * unit * Math.cos(a + Math.PI + side * 0.5), ey + 6 * unit * Math.sin(a + Math.PI + side * 0.5));
            }
            ctx.stroke();
          }
        } else if (ev.type === 'poteau') {
          ctx.beginPath();
          ctx.arc(px, py, (4 + 8 * p) * unit, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(px, py, (8 + 12 * p) * unit, 0, Math.PI * 2);
          ctx.stroke();
        } else if (ev.type === 'barre') {
          // Vue de dessus, la barre se confond avec la ligne de but entre les poteaux : on l'eclaire sur toute sa largeur.
          const goalX = ev.x >= 0.5 ? 1 : 0;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 5 * unit;
          ctx.beginPath();
          ctx.moveTo(...toPx(goalX, 0.5 - halfGoal));
          ctx.lineTo(...toPx(goalX, 0.5 + halfGoal));
          ctx.stroke();
        } else {
          // Corner / sortie de but : eclair sur la ligne de but, au point de sortie (+-NET_SPREAD_M de part et d'autre).
          const spread = NET_SPREAD_M / PITCH_W;
          ctx.lineWidth = 4 * unit;
          ctx.beginPath();
          ctx.moveTo(...toPx(ev.x, ev.y - spread));
          ctx.lineTo(...toPx(ev.x, ev.y + spread));
          ctx.stroke();
          if (ev.type === 'corner') {
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(...toPx(ev.x >= 0.5 ? 1 : 0, ev.y >= 0.5 ? 1 : 0), (6 + 14 * p) * unit, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
      if (BALL_FX_LABELLED.has(ev.type)) {
        ctx.save();
        ctx.globalAlpha = 1 - 0.6 * (age / BALL_FX_LABEL_S);
        ctx.font = 'bold ' + BALL_FX_LABEL_FONT_SCREEN_PX * unit + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lx = Math.min(Math.max(px, 60 * unit), W - 60 * unit);
        const ly = Math.max(py - 22 * unit, 14 * unit);
        ctx.lineWidth = 3 * unit;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.strokeText(BALL_FX_LABELS[ev.type], lx, ly);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(BALL_FX_LABELS[ev.type], lx, ly);
        ctx.restore();
      }
    }
  }

  // --- Filets ------------------------------------------------------------------
  // Un filet derriere chaque ligne de but, entre les poteaux, sur NET.goal_net_depth_m : quadrillage fin
  // blanc casse semi-transparent (ne masque ni joueur ni ballon, peints apres). `deform` : null au repos ;
  // sinon { t, yM } -> oscillation sinusoidale amortie du fond du filet autour du point d'entree.
  const staticNetPaths = {};
  function drawNet(dir, deform) {
    const goalLineX = dir === 1 ? 0 : PITCH_L;
    const midY = PITCH_W / 2;
    const depth = PITCH.goal_net_depth_m;
    const width = PITCH.goal_width_m;
    const envelope = deform
      ? Math.exp(-NET_DECAY_PER_S * deform.t) * Math.sin(2 * Math.PI * NET_FREQ_HZ * deform.t)
      : 0;
    const vertex = (i, j) => {
      const y = midY - width / 2 + width * i / NET_COLS;
      let extra = 0;
      if (deform) {
        const lateral = Math.exp(-Math.pow((y - deform.yM) / NET_SPREAD_M, 2));
        extra = NET_AMPLITUDE_M * envelope * lateral * (j / NET_ROWS);  // la ligne de but (j = 0) ne bouge pas
      }
      return mToPx(goalLineX - dir * (depth * j / NET_ROWS + extra), y);
    };
    // Filet au repos : trace construit une seule fois (Path2D) puis simplement retrace a chaque image.
    let path = deform ? null : staticNetPaths[dir];
    if (!path) {
      path = new Path2D();
      for (let j = 1; j <= NET_ROWS; j++) {            // lignes paralleles a la ligne de but
        path.moveTo(...vertex(0, j));
        for (let i = 1; i <= NET_COLS; i++) path.lineTo(...vertex(i, j));
      }
      for (let i = 0; i <= NET_COLS; i++) {            // lignes perpendiculaires
        path.moveTo(...vertex(i, 0));
        for (let j = 1; j <= NET_ROWS; j++) path.lineTo(...vertex(i, j));
      }
      if (!deform) staticNetPaths[dir] = path;
    }
    ctx.lineWidth = 0.9 * pxPerScreenPx;
    ctx.strokeStyle = 'rgba(235, 235, 235, 0.55)';
    ctx.stroke(path);
  }

  function drawNets(clipData, playhead) {
    let active = null;
    for (const ev of goalEvents(clipData)) {
      if (playhead >= ev.t && playhead - ev.t < NET_ANIM_S) active = ev;
    }
    for (const dir of [1, -1]) {
      drawNet(dir, active && active.dir === dir ? { t: playhead - active.t, yM: active.yM } : null);
    }
  }

  // `playhead` : position de lecture (secondes), egale a `t` sauf pendant le maintien apres un but,
  // ou la derniere image reste affichee (t = duree) alors que le filet continue d'osciller.
  function drawFrame(clipData, t, playhead = t) {
    drawPitch();
    drawNets(clipData, playhead);
    const teams = clipData.metadata.teams;
    const [fa, fb, frac] = findSegment(clipData, t);
    const carrierId = fa.ball.owner || null;
    let headings = headingsByClip.get(clipData);
    if (!headings) { headings = {}; headingsByClip.set(clipData, headings); }
    const segmentDt = fb.t - fa.t;

    const byIdB = {};
    for (const p of fb.players) byIdB[p.id] = p;

    let carrierDraw = null;
    for (const pa of fa.players) {
      const pb = byIdB[pa.id] || pa;
      const x = lerp(pa.x, pb.x, frac);
      const y = lerp(pa.y, pb.y, frac);
      const [px, py] = toPx(x, y);
      const team = teams[pa.team];
      const radius = pa.active ? sizes.activeRadius : sizes.playerRadius;

      // Cap : deplacement (en metres) entre les deux images qui encadrent t.
      if (segmentDt > 0) {
        const dx = (pb.x - pa.x) * PITCH_L, dy = (pb.y - pa.y) * PITCH_W;
        if (Math.hypot(dx, dy) / segmentDt >= HEADING_MIN_SPEED_MS) headings[pa.id] = Math.atan2(-dy, dx);  // y canvas vers le bas
      }
      if (pa.id in headings) drawHeading(px, py, radius, headings[pa.id]);

      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fillStyle = team.color_fill;
      ctx.fill();
      ctx.lineWidth = (pa.active ? 2 : 1) * pxPerScreenPx;
      ctx.strokeStyle = pa.active ? '#ffd700' : team.color_outline;
      ctx.stroke();

      // Numero centre dans le rond, taille proportionnelle au diametre.
      ctx.fillStyle = numberColor(team.color_fill);
      ctx.font = 'bold ' + (2 * radius * NUMBER_FONT_RATIO) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(pa.numero), px, py + 0.5 * pxPerScreenPx);

      if (carrierId !== null && pa.id === carrierId) carrierDraw = [pa, px, py, radius];
    }
    const ballX = lerp(fa.ball.x, fb.ball.x, frac);
    const ballY = lerp(fa.ball.y, fb.ball.y, frac);
    const ballZ = lerp(fa.ball.z, fb.ball.z, frac);
    const [bx, by] = toPx(ballX, ballY);

    // Le nom n'est affiche que tant que le ballon est reellement porte : a terre et a moins de
    // BALL_CARRIED_MAX_M du porteur (le porteur du moteur change a la transition de segment, la
    // passe est deja partie un instant avant).
    if (carrierDraw && ballZ < 0.5 && Math.hypot(bx - carrierDraw[1], by - carrierDraw[2]) <= BALL_CARRIED_MAX_M * SCALE) {
      drawCarrierName(clipData, ...carrierDraw);
    }

    // Ballon : dessine APRES les ronds (visible meme porte), 6 px ecran de diametre,
    // ombre au sol, souleve a l'ecran quand il est en l'air.
    const lift = Math.min(ballZ, 4) * SCALE * 0.5;
    const r = sizes.ballRadius * (1 + Math.min(0.5, ballZ * 0.15));
    ctx.beginPath();
    ctx.ellipse(bx + 0.6 * r, by + 0.6 * r, r, r * 0.8, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(bx, by - lift, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 0.8 * pxPerScreenPx;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.stroke();

    drawBallEvents(clipData, playhead);  // Phase 6, B4-bis : parade, poteau, barre, corner, sortie de but

    if (DEBUG) {
      console.log('[canvas-debug] ' + JSON.stringify({
        frame_idx: debugFrameIdx, t: t, ballon_x: ballX, ballon_y: ballY,
      }));
      debugFrameIdx++;
    }
  }

  if (!isPlayerMode) {
    // --- Mode "gabarit isole" -- comportement INCHANGE (brief 4.1) -------
    const sequence = clips[0];
    const duration = sequence.duration;
    const teams = sequence.metadata.teams;

    document.getElementById('label').textContent =
      sequence.metadata.template + ' -- ' + teams.scorer.name + ' vs ' + teams.opponent.name +
      ' (' + duration.toFixed(1) + 's, ' + sequence.frames.length + ' frames)';

    let playing = true;
    let pausedAtS = 0;
    let startPerfMs = null;

    function currentT(nowMs) {
      if (!playing) return pausedAtS;
      if (startPerfMs === null) startPerfMs = nowMs - pausedAtS * 1000;
      return ((nowMs - startPerfMs) / 1000) % duration; // boucle automatique a la fin
    }

    function tick(nowMs) {
      const t = currentT(nowMs);
      if (playing) pausedAtS = t;
      drawFrame(sequence, t);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    document.getElementById('toggle').addEventListener('click', () => {
      playing = !playing;
      document.getElementById('toggle').textContent = playing ? 'Pause' : 'Lecture';
      if (playing) startPerfMs = null;
    });

    document.getElementById('replay').addEventListener('click', () => {
      pausedAtS = 0;
      startPerfMs = null;
      playing = true;
      document.getElementById('toggle').textContent = 'Pause';
    });
    return;
  }

  // --- Mode "player" (Tache 4.2-4.6) --------------------------------------
  document.getElementById('controls').style.display = 'none';
  document.getElementById('scoreboard').style.display = 'flex';
  document.getElementById('playbar').style.display = 'flex';
  document.getElementById('playerControls').style.display = 'flex';
  document.getElementById('progressBar').style.display = 'block';

  const scoreboardEl = document.getElementById('scoreboard');
  const cartonEl = document.getElementById('carton');
  const cartonMinuteEl = document.getElementById('cartonMinute');
  const cartonEventEl = document.getElementById('cartonEvent');
  const cartonScoreEl = document.getElementById('cartonScore');
  const cartonIntervalEl = document.getElementById('cartonIntervalEvents');
  const playPauseBtn = document.getElementById('playPause');
  const progressBarEl = document.getElementById('progressBar');
  const clipCounterEl = document.getElementById('clipCounter');
  // Icones monochromes (SVG, currentColor) : pause quand ca joue, lecture quand c'est en pause.
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

  // Marqueurs de la barre de progression (Tache 4.4) -- un par clip,
  // position proportionnelle a la minute (echelle fixe 0-90, un match dure
  // 90 minutes par construction du moteur narratif).
  const markerEls = clips.map((clip, idx) => {
    const marker = document.createElement('div');
    // But = cercle blanc plein, occasion = losange gris (voir CSS .goal / .chance).
    const isGoal = clip.metadata.issue === 'but';
    marker.className = 'progress-marker ' + (isGoal ? 'goal' : 'chance');
    marker.style.left = (Math.min(90, Math.max(1, clip.metadata.minute)) / 90 * 100) + '%';
    marker.title = (isGoal ? 'But ' : 'Occasion ') + clip.metadata.minute + "' -- " + clip.metadata.template;
    marker.addEventListener('click', () => jumpToClip(idx));
    progressBarEl.appendChild(marker);
    return marker;
  });

  function updateMarkers(activeIdx) {
    markerEls.forEach((el, idx) => el.classList.toggle('current', idx === activeIdx));
    clipCounterEl.textContent = 'Clip ' + (activeIdx + 1) + ' / ' + clips.length;
  }

  function eventLabel(clip) {
    const equipe = clip.metadata.equipe;
    if (clip.metadata.issue === 'but') return 'BUT ' + equipe.toUpperCase();
    if (clip.metadata.template === 'penalty') return 'Penalty rate';
    return 'Occasion ' + equipe;
  }

  // Un element de Clip.interval_events (Tache 1, brief "canvas player
  // consolidation", 23/09/2026) : {minute, type, equipe, joueur, detail} --
  // voir engine/narrative_player._interval_events. Format inspire de
  // l'exemple du brief ("45' Carton jaune, Nantes #6").
  function intervalEventLine(item) {
    if (item.type === 'carton') {
      return item.minute + "' Carton " + item.detail + ', ' + item.equipe + ' — ' + item.joueur;
    }
    if (item.type === 'remplacement') {
      return item.minute + "' Remplacement, " + item.equipe + ' — ' + item.joueur + ' (' + item.detail + ')';
    }
    return item.minute + "' " + item.type + ', ' + item.equipe + ' — ' + item.joueur;
  }

  // Abreviation de 3 lettres d'un club : on retire les mots d'usage (FC, AS, Stade, Olympique...)
  // puis on prend les 3 premieres lettres du premier mot restant, sans accents, en majuscules.
  const NAME_NOISE = new Set(['fc', 'as', 'sc', 'aj', 'rc', 'ogc', 'stade', 'olympique', 'le', 'la', 'les', 'de', 'real', 'club', 'cf', 'ac', 'afc', 'sv', 'fk', 'ca', 'us', 'ss', 'sk']);
  function abbreviate(name, fromEnd) {
    const words = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^A-Za-z0-9]+/).filter(Boolean);
    const kept = words.filter((w) => !NAME_NOISE.has(w.toLowerCase()));
    const pool = kept.length ? kept : words;
    return (fromEnd ? pool[pool.length - 1] : pool[0]).slice(0, 3).toUpperCase();
  }
  const sbHomeEl = document.getElementById('sbHome');
  const sbScoreEl = document.getElementById('sbScore');
  const sbAwayEl = document.getElementById('sbAway');
  const sbMinuteEl = document.getElementById('sbMinute');
  let sbKey = null;

  // Score affiche : dans un clip de but, l'ANCIEN score (score_before) jusqu'a la frame de franchissement de
  // la ligne, le NOUVEAU (score_after) a partir de cette frame -- la meme condition (playhead >= ev.t) que
  // l'eclaircissement du bloc (updateGoalFlash), donc score et flash basculent ensemble. Hors clip de but :
  // score_after des le debut du clip, comme avant.
  function shownScore(clip, playhead) {
    const events = goalEvents(clip);
    return events.length && playhead < events[0].t ? clip.metadata.score_before : clip.metadata.score_after;
  }

  // Bloc score : abreviations des deux clubs, score synchronise avec le but (voir shownScore), minute du clip.
  // N'ecrit dans le DOM que lorsque le contenu change (pas a chaque image).
  function updateScoreboard(clip, playhead = 0) {
    const [dom, ext] = shownScore(clip, playhead);
    const key = clip.metadata.home_team + '|' + clip.metadata.away_team + '|' + dom + '|' + ext + '|' + clip.metadata.minute;
    if (key === sbKey) return;
    sbKey = key;
    let home = abbreviate(clip.metadata.home_team, false);
    let away = abbreviate(clip.metadata.away_team, false);
    if (home === away) { home = abbreviate(clip.metadata.home_team, true); away = abbreviate(clip.metadata.away_team, true); }
    sbHomeEl.textContent = home;
    sbScoreEl.textContent = dom + ' \u2013 ' + ext;
    sbAwayEl.textContent = away;
    sbMinuteEl.textContent = clip.metadata.minute + "'";
  }

  let currentIdx = 0;
  let playing = true;
  let pausedAtS = 0;
  let startPerfMs = null;
  let showingCarton = false;
  let cartonStartPerfMs = null;
  let endedSent = false; // mode embarque : "fin de lecture" signalee une seule fois par passage

  function notifyClipChange() {
    if (bridge) bridge.clipChange(currentIdx, clips.length, clips[currentIdx].metadata.minute);
  }

  function showCarton(clip) {
    showingCarton = true;
    cartonStartPerfMs = null;
    cartonMinuteEl.textContent = clip.metadata.minute + "'";
    cartonEventEl.textContent = eventLabel(clip);
    const [dom, ext] = clip.metadata.score_after;
    cartonScoreEl.textContent = clip.metadata.home_team + ' ' + dom + ' – ' + ext + ' ' + clip.metadata.away_team;
    const intervalEvents = clip.metadata.interval_events || [];
    cartonIntervalEl.innerHTML = intervalEvents.length
      ? intervalEvents.map((item) => '<div>' + intervalEventLine(item) + '</div>').join('')
      : '';
    cartonEl.style.display = 'flex';
  }

  function hideCarton() {
    showingCarton = false;
    cartonEl.style.display = 'none';
  }

  function jumpToClip(idx) {
    currentIdx = Math.min(Math.max(idx, 0), clips.length - 1);
    pausedAtS = 0;
    startPerfMs = null;
    hideCarton();
    updateMarkers(currentIdx);
    updateScoreboard(clips[currentIdx]);
    endedSent = false;
    notifyClipChange();
  }

  // Eclaircissement du bloc score au but : la classe n'est basculee que lorsque l'etat change (une fois par but),
  // jamais a chaque image ; sans but (aucun evenement) elle n'est jamais posee.
  let goalFlashOn = false;
  function updateGoalFlash(clip, playhead) {
    let on = false;
    for (const ev of goalEvents(clip)) if (playhead >= ev.t && playhead - ev.t < GOAL_FLASH_S) on = true;
    if (on !== goalFlashOn) {
      goalFlashOn = on;
      scoreboardEl.classList.toggle('goal-flash', on);
    }
  }

  function tick(nowMs) {
    const clip = clips[currentIdx];
    const duration = clip.duration;

    if (showingCarton) {
      if (playing) {
        if (cartonStartPerfMs === null) cartonStartPerfMs = nowMs;
        const elapsed = (nowMs - cartonStartPerfMs) / 1000;
        if (elapsed >= CARTON_DURATION_S) {
          hideCarton();
          if (currentIdx < clips.length - 1) {
            jumpToClip(currentIdx + 1);
          }
          // dernier clip : reste sur le carton final a l'ecran (pas de
          // rebouclage automatique, comportement deterministe et simple).
          else if (bridge && !endedSent) {
            endedSent = true;
            bridge.ended();
          }
        }
      }
      drawFrame(clip, duration, playEnd(clip)); // dernier frame du clip fige derriere le carton
      requestAnimationFrame(tick);
      return;
    }

    // `playhead` : 0 -> duration (+ GOAL_HOLD_S apres un but, derniere image maintenue).
    const endAt = playEnd(clip);
    let playhead;
    if (!playing) {
      playhead = pausedAtS;
    } else {
      if (startPerfMs === null) startPerfMs = nowMs - pausedAtS * 1000;
      playhead = (nowMs - startPerfMs) / 1000;
      if (playhead >= endAt) {
        playhead = endAt;
        pausedAtS = playhead;
        showCarton(clip);
      } else {
        pausedAtS = playhead;
      }
    }

    drawFrame(clip, Math.min(playhead, duration), playhead);
    updateScoreboard(clip, playhead);
    updateGoalFlash(clip, playhead);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  updateMarkers(currentIdx);
  updateScoreboard(clips[currentIdx]);
  notifyClipChange();

  document.getElementById('prevClip').addEventListener('click', () => {
    jumpToClip(currentIdx - 1);
    playing = true;
    playPauseBtn.innerHTML = ICON_PAUSE;
  });
  document.getElementById('nextClip').addEventListener('click', () => {
    jumpToClip(currentIdx + 1);
    playing = true;
    playPauseBtn.innerHTML = ICON_PAUSE;
  });
  document.getElementById('replayClip').addEventListener('click', () => {
    pausedAtS = 0;
    startPerfMs = null;
    hideCarton();
    endedSent = false;
    playing = true;
    playPauseBtn.innerHTML = ICON_PAUSE;
  });
  playPauseBtn.addEventListener('click', () => {
    playing = !playing;
    playPauseBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    if (playing) {
      startPerfMs = null;
      cartonStartPerfMs = null;
    }
  });
}

if (!EMBED) {
  // --- Mode standalone : strictement l'ancien comportement ----------------
  startPlayer(SEQUENCE_DATA, null);
} else {
  // --- Mode embarque : protocole version 1 (docs/canvas_integration_state.md
  // §2.11). Seuls messages permis. Iframe -> parent : ready, clipchange,
  // ended, error. Parent -> iframe : init (un seul, apres `ready`). Aucun
  // acces reseau/API/fichier, aucune navigation de la page hote.
  (function () {
    const PROTOCOL_VERSION = 1;
    const OUT_SOURCE = 'simulafoot-canvas';
    const IN_SOURCE = 'simulafoot-host';
    const parentOrigin = EMBED_PARAMS.get('parent_origin');
    const labelEl = document.getElementById('label');
    let started = false;

    // Jamais de '*' : sans parent_origin valide, rien n'est emis.
    function emit(type, extra) {
      if (!parentOrigin || window.parent === window) return;
      window.parent.postMessage(
        Object.assign({ source: OUT_SOURCE, version: PROTOCOL_VERSION, type: type }, extra || {}),
        parentOrigin
      );
    }

    const bridge = {
      clipChange: (index, total, minute) => emit('clipchange', { index: index, total: total, minute: minute }),
      ended: () => emit('ended'),
    };

    function fail(code, message, extra) {
      labelEl.textContent = message;
      emit('error', Object.assign({ code: code, message: message }, extra || {}));
    }

    if (!parentOrigin || window.parent === window) {
      labelEl.textContent = 'Mode embarque : ouvrir dans une iframe avec ?embed=1&parent_origin=<origine>.';
      return;
    }
    labelEl.textContent = 'Chargement de l\'animation...';

    window.addEventListener('error', (e) => fail('render_error', String(e.message || 'erreur de rendu')));

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || event.origin !== parentOrigin) return;
      const msg = event.data;
      if (!msg || msg.source !== IN_SOURCE || msg.type !== 'init') return;
      if (msg.version !== PROTOCOL_VERSION) {
        fail('version_mismatch', 'Version de protocole incompatible.', {
          supported: [PROTOCOL_VERSION], received: msg.version === undefined ? null : msg.version,
        });
        return;
      }
      if (started) return; // un seul init pris en compte
      const clips = msg.payload && msg.payload.clips;
      if (!Array.isArray(clips) || clips.length === 0) {
        fail('invalid_payload', 'Payload d\'animation invalide ou vide.');
        return;
      }
      started = true;
      labelEl.textContent = '';
      try {
        startPlayer(clips, bridge);
      } catch (err) {
        fail('render_error', String(err && err.message ? err.message : err));
      }
    });

    emit('ready');
  })();
}
</script>
</body>
</html>
