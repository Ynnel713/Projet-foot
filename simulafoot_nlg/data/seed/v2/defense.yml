        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} dégage prudemment en touche face à {adversaire}, sans prendre
        le moindre risque.'
      weight: 1.0
      cooldown_matches: 2
      conditions: []
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} suit son vis-à-vis de près, l''accompagne vers la ligne de touche
        et récupère la balle.'
      weight: 1.0
      cooldown_matches: 2
      conditions: []
      slots:
      - slot_name: joueur
        expression: player.full_name
  - code: SURNOM
    label: Surnom
    is_default: false
    phrases:
    - text: Le roc ne cède pas un centimètre et repousse l'assaut de {adversaire}
        comme si de rien n'était !
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Strength
        operator: '>='
        value: '88'
        mandatory: true
      slots:
      - slot_name: adversaire
        expression: context.opponent_team
    - text: Le verrou interdit tout passage à {adversaire}, aucune échappée ne lui
        résiste !
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Tackling
        operator: '>='
        value: '90'
        mandatory: true
      slots:
      - slot_name: adversaire
        expression: context.opponent_team
    - text: Le chasseur fond sur le porteur du ballon et lui vole la possession avant
        qu'il n'ait pu réagir !
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Pace
        operator: '>='
        value: '90'
        mandatory: true
      - attribute: Tackling
        operator: '>='
        value: '75'
        mandatory: true
      slots: []
    - text: L'ancien couvre l'espace avec une anticipation que l'âge n'a en rien émoussée
