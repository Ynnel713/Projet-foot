[project]
name = "ligue1-simulateur"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "streamlit>=1.60.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # scripts/scrape_fminside_attributes.py (importé par
    # tests/test_scrape_fminside_attributes.py) -- pas des dépendances du
    # package lui-même, juste de ce script utilitaire hors src/ligue1sim.
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.6",
]

[tool.uv]
# Le projet vit dans OneDrive : le hardlinking par défaut d'uv échoue sur les
# fichiers synchronisés dans le cloud, on force donc la copie de fichiers.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ligue1sim"]

[tool.pytest.ini_options]
# engine/ (brief "narrative engine foundations", 23/09/2026) est un module
# hors de src/ligue1sim -- pas encore un package installable, juste un
# fichier unique (voir engine/narrative.py) -- pythonpath le rend
# importable depuis tests/ sans sys.path.insert() disséminé.
pythonpath = ["engine"]
# Brief "mark narrative_player integration tests" (24/09/2026) : diagnostic
# préalable -- 7 tests de tests/test_narrative_player.py (simulation de 100
# matchs + rendu complet des frames d'animation) représentent ~99% du temps
# de la suite complète (~1838s sur ~1836-1897s selon le run). `not
# integration` par défaut : run quotidien en quelques secondes, la garantie
# statistique sur 100 matchs reste disponible à la demande.
markers = [
    "integration: tests d'intégration lourds (~30 min, 100 matchs simulés). Lancer via pytest -m integration.",
]
addopts = "-m 'not integration'"
