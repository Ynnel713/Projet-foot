      conditions:
      - attribute: preferred_moves
        operator: contient
        value: Arrives Late In Opposition Area
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} multiplie les appuis et les contrôles supplémentaires pour ramener
        systématiquement le ballon sur son pied fort, quitte à perdre un temps précieux
        face à la pression de {adversaire}. Une habitude qui le rend parfois prévisible,
        mais rarement prise en défaut sur la qualité d''exécution.'
      weight: 1.0
      conditions:
      - attribute: preferred_moves
        operator: contient
        value: Avoids Using Weaker Foot
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} relance proprement depuis sa propre surface, ballon collé au
        pied, et élimine la première ligne de pressing de {adversaire} d''un dribble
