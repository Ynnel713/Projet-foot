[project]
name = "simulafoot-nlg"
version = "0.1.0"
description = "Squelette technique du moteur NLG (temps forts textuels) de Simulafoot -- aucune phrase, aucun scenario en dur : uniquement la base sur laquelle la banque de phrases sera branchee."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

# --- ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# B008 (appel de fonction dans une valeur par defaut d'argument) desactive :
# argparse/click utilisent ce pattern couramment dans cli.py.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

[tool.ruff.lint.per-file-ignores]
# pilotes_v2/ : contenu editorial brut en cours de validation (phrases de la
# banque V2, pas encore integrees au pipeline reel) -- les lignes de texte
# depassent la limite de code standard, ce n'est pas du code a corriger.
"pilotes_v2/*.py" = ["E501"]

# --- mypy --------------------------------------------------------------
# python_version=3.12 (pas 3.11 malgre requires-python initialement envisage
# a 3.11) : numpy (dependance transitive de pandas) publie des stubs qui
# utilisent la syntaxe `type X = ...` (PEP 695, 3.12+) sans garde de
# compatibilite -- mypy --strict en mode 3.11 echoue a les parser (erreur de
# syntaxe dans numpy lui-meme, rien a voir avec ce projet). 3.12 est de toute
# facon la version installee dans l'environnement de developpement (voir
# decisions du plan).
[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine", "cli.py", "data/import", "scripts"]
# duckdb/yaml n'ont pas de stubs officiels complets -- on ignore les imports
# manquants pour ces deux-la plutot que de desactiver --strict globalement.
[[tool.mypy.overrides]]
module = ["duckdb.*", "yaml.*"]
ignore_missing_imports = true

# --- pytest / couverture -------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=engine --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["engine"]
omit = ["*/tests/*"]
