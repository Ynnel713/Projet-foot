      - slot_name: joueur
        expression: player.full_name
    - text: '{joueur} surgit de nulle part au second poteau, arrivé lancé depuis le
        milieu de terrain sans que personne de {adversaire} n''ait pensé à le suivre.
        Ce genre de course invisible, répétée match après match, fait toute la différence
        dans les couloirs de la surface adverse.'
