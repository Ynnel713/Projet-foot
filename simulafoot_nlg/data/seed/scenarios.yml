      conditions:
      - attribute: preferred_moves
        operator: contient
        value: Crosses Early
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} rentre indifféremment vers l''intérieur depuis la droite comme
