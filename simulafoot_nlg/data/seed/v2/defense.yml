      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: age
        operator: '>='
        value: '33'
        mandatory: true
      - attribute: Vision
        operator: '>='
        value: '80'
        mandatory: true
      slots: []
    - text: Le pilier domine chaque duel aérien et repousse {adversaire} d'un simple
        regard !
      weight: 1.0
      cooldown_matches: 2
      conditions:
      - attribute: Heading
        operator: '>='
        value: '88'
        mandatory: true
      - attribute: Strength
        operator: '>='
        value: '85'
        mandatory: true
      slots:
      - slot_name: adversaire
        expression: context.opponent_team
    - text: Le métronome défensif dicte le repli de son équipe avec un calme qui force
