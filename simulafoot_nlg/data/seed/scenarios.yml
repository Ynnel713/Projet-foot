      - attribute: preferred_moves
        operator: contient
        value: Bring Ball Out of Defence
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} décroche loin de sa position habituelle pour venir chercher
        le ballon dans les pieds, échappant ainsi au marquage serré de {adversaire}.
        Ce mouvement récurrent désorganise complètement le pressing adverse et libère
        de l''espace dans son dos pour ses coéquipiers.'
      weight: 1.0
      conditions:
      - attribute: preferred_moves
        operator: contient
        value: Comes Deep To Get Ball
        mandatory: true
      slots:
      - slot_name: joueur
        expression: player.full_name
      - slot_name: adversaire
        expression: context.opponent_team
    - text: '{joueur} ne temporise jamais sur son côté : dès qu''il touche le ballon,
